[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "python-research-lab"
version = "0.1.0"
description = "Reproducible structural logic experiments and modular scientific research tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
scientific = [
  "numpy>=2.0", "scipy>=1.14", "sympy>=1.13", "mpmath>=1.3",
  "networkx>=3.3", "pandas>=2.2", "matplotlib>=3.9", "plotly>=6.0",
]
physics = ["astropy>=6.1", "qutip>=5.1", "pint>=0.24", "ase>=3.23", "rdkit>=2024.9"]
quantum = ["qutip>=5.1"]
cosmology = ["astropy>=6.1"]
notebooks = ["jupyterlab>=4.2", "ipython>=8.27", "nbclient>=0.10", "nbformat>=5.10", "ipykernel>=6.29"]
dev = ["pytest>=8.3", "ruff>=0.11", "mypy>=1.15", "pre-commit>=4.1", "rich>=13.9", "tqdm>=4.66", "python-dotenv>=1.0"]

[project.scripts]
research-lab = "research_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "scientific: requires optional scientific dependencies",
  "physics: requires optional physics dependencies",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["notebooks", "results", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src/research_lab"]
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
