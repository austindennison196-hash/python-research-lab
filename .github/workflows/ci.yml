name: Research laboratory checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy
      - run: pytest
      - run: research-lab --help

  scientific:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev,scientific,physics,notebooks]'
      - run: pytest
      - name: Execute every research notebook
        env:
          MPLBACKEND: Agg
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat
          from nbclient import NotebookClient
          for path in sorted(Path('notebooks').glob('*.ipynb')):
              notebook = nbformat.read(path, as_version=4)
              NotebookClient(notebook, timeout=180, kernel_name='python3', resources={'metadata': {'path': '.'}}).execute()
              print(f'Executed {path}')
          PY

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e .
      - run: python scripts/build_web.py
      - run: node --test tests/web_models.test.mjs
      - run: npm install --prefix /tmp/browser-check --no-save playwright@1.62.1
      - run: /tmp/browser-check/node_modules/.bin/playwright install --with-deps chromium
      - name: Validate the app in Chromium
        env:
          NODE_PATH: /tmp/browser-check/node_modules
        run: |
          python -m http.server 8765 --directory dist/site --bind 127.0.0.1 > /tmp/web-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:8765/data.json > /dev/null; then break; fi
            sleep 1
          done
          node scripts/check_web.cjs
